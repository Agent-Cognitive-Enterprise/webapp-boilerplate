name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_SECRET_KEY: ci-test-secret-key
      INITIAL_SETUP_TOKEN: ci-test-setup-token
      APP_ENV: test
      DB_TYPE: sqlite
      SQLITE_DB_PATH: test_ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend lint
        run: ruff check .

      - name: Run backend type checks
        run: PYTHONPATH=. mypy --config-file pyproject.toml

      - name: Run backend tests
        run: PYTHONPATH=. pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Verify production build
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_SECRET_KEY: ci-test-secret-key
      INITIAL_SETUP_TOKEN: ci-test-setup-token
      APP_ENV: test
      DB_TYPE: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: PYTHONPATH=..:. pytest ../frontend/tests -q

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-playwright-artifacts
          path: frontend/tests/artifacts
          if-no-files-found: ignore
