services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ./backend.sqlite.env
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
